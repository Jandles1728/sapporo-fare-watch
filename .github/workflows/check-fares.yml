name: Check Sapporo fares
# Runs both trackers twice a day, side by side, then publishes both pages:
#   /        Sapporo trip (config.yaml)
#   /tokyo/  Tokyo round trips and one-ways (tokyo.yaml)
on:
  schedule:
    - cron: "17 14,2 * * *"   # ~7am and ~7pm Pacific
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: fare-check
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - tracker: sapporo
            args: ""
            log: last_run.log
            files: prices.db report.html last_run.log
          - tracker: tokyo
            args: --config tokyo.yaml --name tokyo
            log: last_run-tokyo.log
            files: prices-tokyo.db report-tokyo.html last_run-tokyo.log
    name: check (${{ matrix.tracker }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Check fares
        shell: bash
        run: set -o pipefail; python flight_watch.py run ${{ matrix.args }} 2>&1 | tee ${{ matrix.log }}
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - name: Save history
        if: always()
        shell: bash
        run: |
          git config user.name "fare-bot"
          git config user.email "fare-bot@users.noreply.github.com"
          for f in ${{ matrix.files }}; do [ -f "$f" ] && git add "$f"; done
          git commit -m "Fare check (${{ matrix.tracker }}) $(date -u +%F_%H%M)" || { echo "no changes"; exit 0; }
          # the other tracker may have pushed first; they touch different files, so rebase is clean
          for i in 1 2 3 4 5; do git pull -q --rebase origin main && git push && exit 0; sleep $((5 + RANDOM % 10)); done
          exit 1

  publish:
    needs: check
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - name: Build site
        run: |
          mkdir -p _site/tokyo
          if [ -f report.html ]; then cp report.html _site/index.html; else echo "<p>No data yet.</p>" > _site/index.html; fi
          if [ -f report-tokyo.html ]; then cp report-tokyo.html _site/tokyo/index.html; else echo "<p>No data yet.</p>" > _site/tokyo/index.html; fi
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: deploy
        uses: actions/deploy-pages@v4
