name: Check Sapporo fares
on:
  schedule:
    - cron: "17 14,2 * * *"   # ~7am and ~7pm Pacific
  workflow_dispatch: {}
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: fare-check
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Check fares
        shell: bash
        run: set -o pipefail; python flight_watch.py run 2>&1 | tee last_run.log
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - name: Save history
        if: always()
        run: |
          git config user.name "fare-bot"
          git config user.email "fare-bot@users.noreply.github.com"
          for f in last_run.log prices.db report.html; do [ -f "$f" ] && git add "$f"; done
          git commit -m "Fare check $(date -u +%F_%H%M)" || echo "no changes"
          git push
      - name: Build site
        if: always()
        run: |
          mkdir -p _site
          if [ -f report.html ]; then cp report.html _site/index.html; else echo "<p>No data yet.</p>" > _site/index.html; fi
      - uses: actions/upload-pages-artifact@v3
        if: always()
        with: { path: _site }
      - id: deploy
        if: always()
        uses: actions/deploy-pages@v4
