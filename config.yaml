# Flight Watch — Sapporo snowboard trip
# Edit this file, then run:  python flight_watch.py run

origins: [SEA, YVR]          # Seattle-Tacoma, Vancouver
destination: CTS             # fly into Sapporo New Chitose
# Fly home from a different city ("open jaw"). Remove these lines for a normal round trip.
fly_home_from: [HND, NRT]    # Tokyo Haneda, Tokyo Narita
compare_one_ways: true       # also price two separate one-way tickets and use whichever is cheaper

# Every outbound date in this window is paired with every date you fly home.
depart_from: 2027-02-12
depart_to:   2027-02-15
return_from: 2027-02-20
return_to:   2027-02-22
# Prefer fixed trip lengths instead? Delete return_from/return_to and use e.g.:
# trip_lengths: [7, 10]

adults: 1
seat: economy                # economy / premium-economy / business / first
max_stops: 1                 # per flight: 0 = nonstop only, 1, 2, or null for any
timezone: America/Los_Angeles  # times shown in the report
currency: USD                # one currency for both airports so prices compare fairly (use CAD if you prefer)

# Data source: "google" (free, scrapes Google Flights via fast-flights)
#              "serpapi" (more reliable; needs SERPAPI_KEY env var, 250 free searches/month)
provider: google
pause_seconds: 4             # politeness delay between searches (random jitter added)

alerts:
  target_price: 900          # alert whenever any itinerary is at or below this
  drop_percent: 8            # alert when a date combo drops at least this % since the last check
  # Push notifications via ntfy.sh (free app). Keep the topic name out of this public file:
  # set it as the NTFY_TOPIC secret in GitHub (Settings → Secrets and variables → Actions).
  ntfy_topic: ""
